<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Главная</title>
  </head>
  <body class="events">
    <header class="header" id="top">
    <div class="container header-inner">
      <a class="logo" href="#top">EVENT-СЕРВИС</a>
      <nav class="menu" aria-label="Основное меню">
        <a href="./index.html">События</a>
        <a href="./about.html">О проекте</a>
      </nav>
    </div>
  </header>

  <main class="container" id="events">
    <h1>Афиша событий</h1>

    <div class="filter-container">
        <div class="filters">
            <button class="button active" type="button" data-category="all">Все</button>
            <button class="button" type="button" data-category="category1">Категория 1</button>
            <button class="button" type="button" data-category="category2">Категория 2</button>
            <button class="button" type="button" data-category="category3">Категория 3</button>
        </div>
        <div class="sorting">
            <label for="sort-select">Сортировка</label>
            <select class="sort-select" id="sort-select">
                <option value="default">По умолчанию</option>
                <option value="title-asc">По названию А-Я</option>
                <option value="title-desc">По названию Я-А</option>
            </select>
        </div>
    </div>

    <div class="cards"></div>

    <div class="more-events">
      <button class="button" type="button">Показать еще</button>
    </div>

    <template id="event-card">
        <article class="card">
            <div class="card-image"></div>
            <div class="card-content">
                <h2></h2>
                <div class="card-cotegories"></div>
                <p></p>
                <a class="button">Подробнее</a>
            </div>
        </article>
    </template>
  </main>
  </body>
</html>
