<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра Дуэль на кубиках</title>
</head>
<body class="dices">
    <main class="container">
        <section class="game">
            <h1 class="game-title">Игра «Дуэль на кубиках»</h1>
            <p class="game-description">Бросай кубик. Побеждает тот, у кого выпало больше.</p>

            <div class="dice-container">
                <div class="dice-card">
                    <div class="dice-name">Ты</div>
                    <div class="dice">⚀</div>
                </div>
                <div class="versus">VS</div>
                <div class="dice-card">
                    <div class="dice-name">Компьютер</div>
                    <div class="dice">⚀</div>
                </div>
            </div>

            <button class="roll-button">Бросить кубик</button>
        </section>
        <aside class="status">
            <h2 class="status-title"></h2>
            <div class="score-container">
                <div class="score-item">
                    <div class="score-name">Ты</div>
                    <div class="score">0</div>
                </div>
                <div class="score-item">
                    <div class="score-name">Компьютер</div>
                    <div class="score">0</div>
                </div>
            </div>
            <div class="result">
                <h3 class="history-title">История раундов</h3>
                <div class="history">
                    <div class="history-item history-grey">3 — 3</div>
                    <div class="history-item history-red">2 — 5</div>
                    <div class="history-item history-green">5 — 1</div>
                <div>
            </div>
        </aside>
    </main>
</body>
</html>
